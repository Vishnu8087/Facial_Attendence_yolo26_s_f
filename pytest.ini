[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
addopts =
    -ra
    --strict-markers
    --strict-config
    --tb=short
    --showlocals
    --color=yes
markers =
    integration: end-to-end tests against the FastAPI app / WebSocket
    unit: pure unit tests against app.core.* with mocks
    perf: performance benchmarks (skipped unless --benchmark-only)
    slow: tests that take > 1s
filterwarnings =
    error
    ignore::DeprecationWarning:pytest.*
    ignore::DeprecationWarning:_pytest.*
    ignore::DeprecationWarning:sqlalchemy.*
    ignore::DeprecationWarning:insightface.*
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %H:%M:%S
