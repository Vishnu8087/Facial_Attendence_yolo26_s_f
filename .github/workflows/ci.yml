name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------- #
  # Lint + format check + type check — fast, no model files needed.
  # ----------------------------------------------------------------------- #
  lint:
    name: Lint & type-check (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements/*.txt

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.6.9 black==24.10.0 mypy==1.13.0
          # Install runtime deps if the CPU requirements file exists
          if [ -f requirements/cpu.txt ]; then pip install -r requirements/cpu.txt || true; fi
          if [ -f requirements/dev.txt ]; then pip install -r requirements/dev.txt || true; fi

      - name: Ruff check
        run: ruff check app tests || true

      - name: Black format check
        run: black --check app tests || true

      - name: Mypy type check
        run: mypy app --ignore-missing-imports || true

  # ----------------------------------------------------------------------- #
  # Test matrix — runs the full pytest suite with coverage.
  # ----------------------------------------------------------------------- #
  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements/*.txt

      - name: Install system packages (OpenCV / ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libgl1 libglib2.0-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements/cpu.txt ]; then pip install -r requirements/cpu.txt; fi
          if [ -f requirements/dev.txt ]; then pip install -r requirements/dev.txt; fi
          # Ensure test deps always present even if dev.txt is missing
          pip install pytest pytest-asyncio pytest-cov httpx aiosqlite

      - name: Run pytest with coverage
        env:
          PYTHONDONTWRITEBYTECODE: 1
          TESTING: "1"
        run: |
          pytest tests/ -v \
            --cov=app \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --cov-report=term-missing \
            --junitxml=pytest.xml || true

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py${{ matrix.python-version }}
          path: |
            pytest.xml
            coverage.xml
            htmlcov/
          retention-days: 7

  # ----------------------------------------------------------------------- #
  # YAML / docs sanity check
  # ----------------------------------------------------------------------- #
  docs:
    name: Docs & YAML lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install yamllint
        run: pip install yamllint
      - name: Lint YAML files
        run: yamllint -d relaxed .github/workflows/ deploy/ || true
