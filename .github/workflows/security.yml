name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run nightly at 02:30 UTC
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  packages: read

jobs:
  # ----------------------------------------------------------------------- #
  # Dependency review on PRs — uses GitHub's built-in dependency graph.
  # ----------------------------------------------------------------------- #
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate

  # ----------------------------------------------------------------------- #
  # Trivy scan of the built Docker images (consumes artifacts from
  # docker.yml via workflow_run trigger).
  # ----------------------------------------------------------------------- #
  trivy-image:
    name: Trivy scan Docker images
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - name: Download CPU image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image-cpu
          path: /tmp/images
        continue-on-error: true

      - name: Download GPU image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image-gpu
          path: /tmp/images
        continue-on-error: true

      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: /tmp/images/image-cpu.tar
          severity: CRITICAL,HIGH
          exit-code: "0"  # warn-only for now; flip to 1 to fail builds
          format: sarif
          output: trivy-results.sarif
        continue-on-error: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  # ----------------------------------------------------------------------- #
  # Trivy filesystem scan — runs even when no image artifact is available.
  # ----------------------------------------------------------------------- #
  trivy-fs:
    name: Trivy scan source tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "0"
          format: sarif
          output: trivy-fs.sarif
        continue-on-error: true
      - name: Upload Trivy fs results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-fs.sarif

  # ----------------------------------------------------------------------- #
  # pip-audit — Python dependency vulnerability scan.
  # ----------------------------------------------------------------------- #
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit requirements
        run: |
          if [ -f requirements/cpu.txt ]; then
            pip-audit -r requirements/cpu.txt --strict || true
          fi
          if [ -f requirements/gpu.txt ]; then
            pip-audit -r requirements/gpu.txt --strict || true
          fi
          if [ -f requirements/dev.txt ]; then
            pip-audit -r requirements/dev.txt --strict || true
          fi
