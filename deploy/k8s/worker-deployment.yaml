---
# Worker Deployment — background multi-camera ingestion processor.
# Same image as api, different entrypoint. No HPA — manual scale (1–3 replicas).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: facial-attendance
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: facial-attendance-system
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: Recreate              # workers hold stream sessions; avoid double-process during roll
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: facial-attendance-system
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      terminationGracePeriodSeconds: 90
      initContainers:
        - name: wait-for-db
          image: postgres:16-alpine
          command:
            - /bin/sh
            - -ec
            - |
              until pg_isready -h "${DB_HOST}" -p "${DB_PORT:-5432}" -U "${DB_USER}"; do
                echo "[init] waiting for ${DB_HOST}:${DB_PORT:-5432} …"
                sleep 2
              done
          envFrom:
            - configMapRef:
                name: facial-attendance-config
            - secretRef:
                name: facial-attendance-secret
        - name: fetch-models
          image: facial-attendance/api:latest-cpu
          command:
            - /bin/sh
            - -ec
            - |
              if [ -f /models/.models-ready ]; then exit 0; fi
              mkdir -p /models
              python - <<'PY'
              import os
              os.environ.setdefault("INSIGHTFACE_HOME", "/models/insightface")
              os.environ.setdefault("HF_HOME", "/models/huggingface")
              try:
                  from insightface.app import FaceAnalysis
                  app = FaceAnalysis(name=os.environ.get("MODEL_NAME","buffalo_l"),
                                     providers=["CPUExecutionProvider"])
                  app.prepare(ctx_id=-1, det_size=(640,640))
              except Exception as exc:
                  print(f"[init][WARN] {exc}")
              PY
              touch /models/.models-ready
          envFrom:
            - configMapRef:
                name: facial-attendance-config
          volumeMounts:
            - name: models
              mountPath: /models
      containers:
        - name: worker
          image: facial-attendance/api:latest-cpu
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.worker"]
          ports:
            - name: metrics
              containerPort: 8001
          envFrom:
            - configMapRef:
                name: facial-attendance-config
            - secretRef:
                name: facial-attendance-secret
          env:
            - name: DATABASE_URL
              value: "postgresql+asyncpg://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)"
            - name: REDIS_URL
              value: "redis://$(REDIS_HOST):$(REDIS_PORT)/$(REDIS_DB)"
            - name: PROMETHEUS_PORT
              value: "8001"
          volumeMounts:
            - name: models
              mountPath: /app/models
              readOnly: true
            - name: app-data
              mountPath: /app/data
            - name: app-logs
              mountPath: /app/logs
            - name: config-file
              mountPath: /app/configs
              readOnly: true
          # Workers expose /metrics on 8001 but have no HTTP liveness endpoint
          # — exec probe instead.
          livenessProbe:
            exec:
              command: ["python", "-c", "import sys; sys.exit(0)"]
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
              # nvidia.com/gpu: 1   # uncomment on GPU nodes
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: api-models-pvc
        - name: app-data
          emptyDir: {}
        - name: app-logs
          emptyDir: {}
        - name: config-file
          configMap:
            name: facial-attendance-config-file

---
# Optional PDB for worker so a node drain doesn't kill all replicas at once
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: worker
  namespace: facial-attendance
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
      app.kubernetes.io/component: worker
