---
#  S E C R E T S   —   EXAMPLE ONLY
#  --------------------------------------------------------------------------
#  The values below are PLACEHOLDERS (base64). Replace with real base64-encoded
#  secrets before applying. DO NOT commit real secrets to git.
#
#  For production use one of:
#    - Sealed Secrets  : kubeseal < secret.yaml > sealed-secret.yaml
#    - External Secrets: bind to AWS Secrets Manager / GCP SM / Vault
#    - HashiCorp Vault : vault-injector sidecar
#  --------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: facial-attendance-secret
  namespace: facial-attendance
  labels:
    app.kubernetes.io/name: facial-attendance
    app.kubernetes.io/part-of: facial-attendance-system
  annotations:
    # Reminder for reviewers / SRE
    description: "Replace these base64 placeholders. Use sealed-secrets / external-secrets / Vault in prod."
type: Opaque
data:
  # echo -n 'attendance' | base64
  DB_USER: YXR0ZW5kYW5jZQ==
  # echo -n 'change-me-to-strong-password' | base64
  DB_PASSWORD: Y2hhbmdlLW1lLXRvLXN0cm9uZy1wYXNzd29yZA==
  # JWT signing secret (>= 32 bytes). Generate with: openssl rand -hex 32
  JWT_SECRET: Y2hhbmdlLW1lLWp3dC1zZWNyZXQtbm90LWZvci1wcm9kdWN0aW9u
  # Sentry DSN (leave empty to disable)
  SENTRY_DSN: ""
  # Grafana admin password
  GRAFANA_ADMIN_PASSWORD: YWRtaW4=
  # Optional: API key for upstream model CDN
  MODEL_DOWNLOAD_TOKEN: ""
