# alembic.ini — Alembic configuration for the Facial Attendance System.
#
# Run migrations:
#   alembic upgrade head
#   alembic downgrade -1
#   alembic revision --autogenerate -m "describe change"
#
# The actual migration environment lives in `app/db/migrations/`.
# The URL is set programmatically by `app/db/migrations/env.py` from
# `app.config.settings.database_url` (so the same alembic.ini works in
# dev, docker, and k8s). The value here is just a placeholder.

[alembic]
script_location = app/db/migrations
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url = postgresql+asyncpg://attendance:change-me@localhost:5432/attendance

# Timezone for filenames (default: empty = UTC).
timezone =

# Max length of characters for slugified revision messages.
truncate_slug_length = 40

# Template file for new revisions.
# file_template = %%(rev)s_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
